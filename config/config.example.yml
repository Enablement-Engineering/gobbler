# Gobbler configuration
# Copy to ~/.config/gobbler/config.yml or run: gobbler config init
#
# Current precedence where a setting is supported:
#   1. CLI option
#   2. Config file
#   3. Integration-specific environment variable
#   4. Built-in default
#
# Gobbler does not provide a universal GOBBLER_* override system and does not
# currently use GOBBLER_CONFIG to select another file.

# Reusable proxies. ${VAR_NAME} substitution is supported in proxy fields.
proxy_services:
  # webshare:
  #   type: rotating
  #   username: ${WEBSHARE_USER}
  #   password: ${WEBSHARE_PASS}
  # datacenter:
  #   type: static
  #   url: ${PROXY_URL}

providers:
  # YouTube uses a transcript-specific provider interface.
  youtube:
    default: youtube-transcript-api
    youtube-transcript-api:
      # proxy: webshare
      # fallback:
      #   provider: transcriptapi
      #   on: [ip_blocked, rate_limited]
    transcriptapi: {}
      # Reads TRANSCRIPTAPI_KEY.

  # Registered conversion providers. Note that the no-flag `gobbler audio`
  # path currently selects whisper-local directly; use --provider to override.
  transcription:
    default: whisper-local
    whisper-local:
      model: small
    # openai-whisper:
    #   model: whisper-1
    #   timeout: 120
    # Reads OPENAI_API_KEY.

  document:
    # The no-flag CLI currently selects docling directly.
    default: docling
    docling:
      ocr: true

  webpage:
    # The no-flag CLI currently selects crawl4ai directly.
    default: crawl4ai
    crawl4ai:
      timeout: 30
      # proxy: webshare

# Legacy/direct converter settings retained by the current schema.
whisper:
  model: small
  language: auto

docling:
  ocr: true
  vlm: false

crawl4ai:
  timeout: 30
  max_timeout: 120

# Service endpoints read by the default document/webpage providers.
services:
  crawl4ai:
    host: localhost
    port: 11235
    # Must match CRAWL4AI_API_TOKEN used by Docker Compose.
    api_token: gobbler-local-token
  docling:
    host: localhost
    port: 5001

# Output compatibility settings. Current conversion commands still use
# explicit CLI flags: stdout without -o, and --format for representation.
output:
  default_format: frontmatter
  timestamp_format: iso8601
  default_directory: null

# Used by docker-compose.yml through GOBBLER_MODELS_PATH, not dynamically read
# by the Python CLI to relocate an already-running container mount.
models_path: ~/.gobbler/models

# Compatibility/reserved settings. The current job queue is SQLite-backed,
# queueing is explicit through --queue, and no automatic threshold is applied.
queue:
  auto_queue_threshold: 105
  default_queue: default

# Monitoring values remain in the effective schema but do not start a metrics
# server or globally reconfigure all command logging by themselves.
monitoring:
  metrics_enabled: false
  metrics_port: 9090
  metrics_host: 0.0.0.0
  log_format: text
  log_level: INFO
  health_check_interval: 60
