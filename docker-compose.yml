services:
  # Crawl4AI - Advanced web scraping with JavaScript rendering
  crawl4ai:
    image: unclecode/crawl4ai:basic
    container_name: gobbler-crawl4ai
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_TIMEOUT=30
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-gobbler-local-token}
      - DISPLAY=:99
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1'
    restart: unless-stopped
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Docling - Document conversion (PDF, DOCX, PPTX, XLSX)
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: gobbler-docling
    ports:
      - "5001:5001"
    volumes:
      # Model cache - user can customize this path in config
      - ${GOBBLER_MODELS_PATH:-${HOME}/.gobbler/models}/docling:/app/models
    environment:
      - DOCLING_OCR=true
      - DOCLING_VLM=false
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: '4'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: gobbler-network
