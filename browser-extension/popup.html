<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gobbler</title>
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #1a1a1a;
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 14px;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      display: block;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    button:hover {
      background: #0052a3;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .config {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
    }

    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .output {
      margin-top: 12px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      display: none;
    }

    .output.visible {
      display: block;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .actions button {
      flex: 1;
      font-size: 12px;
      padding: 8px;
    }

    .ws-status {
      font-size: 12px;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      text-align: center;
    }

    .ws-status.connected {
      background: #d4edda;
      color: #155724;
    }

    .ws-status.disconnected {
      background: #f8d7da;
      color: #721c24;
    }

    .group-section {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 6px;
      background: #fff8f0;
      border: 1px solid #f0a050;
    }

    .group-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .group-status-text {
      font-size: 13px;
      font-weight: 500;
    }

    .group-status-text.in-group {
      color: #155724;
    }

    .group-status-text.not-in-group {
      color: #856404;
    }

    .group-btn {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    .group-btn.add {
      background: #28a745;
      color: white;
    }

    .group-btn.add:hover {
      background: #218838;
    }

    .group-btn.remove {
      background: #dc3545;
      color: white;
    }

    .group-btn.remove:hover {
      background: #c82333;
    }

    .tab-count {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }

    .tab-list {
      font-size: 11px;
      color: #555;
      margin-top: 8px;
      max-height: 80px;
      overflow-y: auto;
    }

    .tab-list-item {
      padding: 3px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-list-item.active {
      font-weight: 600;
      color: #0066cc;
    }

    .not-in-group-warning {
      background: #fff3cd;
      color: #856404;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
      line-height: 1.4;
    }

    .not-in-group-warning.visible {
      display: block;
    }

    .group-btn.add {
      min-width: 90px;
    }
  </style>
</head>
<body>
  <h1>🦃 Gobbler</h1>

  <div id="wsStatus" class="ws-status">Checking connection...</div>

  <div class="group-section">
    <div class="group-status">
      <span id="groupStatusText" class="group-status-text">Checking...</span>
      <button id="groupBtn" class="group-btn add">Add Tab</button>
    </div>
    <div id="tabCount" class="tab-count"></div>
    <div id="tabList" class="tab-list"></div>
  </div>

  <div id="notInGroupWarning" class="not-in-group-warning">
    ⚠️ Current tab is not in Gobbler group. Add it to enable extraction.
  </div>

  <div id="status" class="status"></div>

  <button id="extractBtn">Extract Current Page</button>
  <button id="extractWithSelector" style="background: #6c757d;">Extract with Selector</button>

  <div class="config">
    <label for="serverUrl">Gobbler Server URL</label>
    <input type="text" id="serverUrl" value="http://localhost:4625" placeholder="http://localhost:4625">
  </div>

  <div id="output" class="output"></div>

  <div class="actions" id="actions" style="display: none;">
    <button id="copyBtn">Copy</button>
    <button id="sendToClaudeBtn">Send to Claude</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
