[project]
name = "gobbler"
version = "0.2.27"
description = "Universal content conversion fabric - convert YouTube, web, documents, audio/video to markdown via CLI and skills"
authors = [
    {name = "Dylan Isaac", email = "dylan@enablement.engineering"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = [
    "markdown",
    "conversion",
    "transcription",
    "web-scraping",
    "youtube",
    "whisper",
    "ai-agents",
    "claude",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    # Core conversion
    "youtube-transcript-api>=0.6.3",
    "yt-dlp>=2026.6.9",
    "faster-whisper>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "markdownify>=0.13.0",
    # Legacy Excel (.xls) support
    "xlrd>=2.0.0",
    "openpyxl>=3.1.5",
    # HTTP & Async
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "aiofiles>=24.0.0",
    # CLI
    "typer>=0.26.7",
    "rich>=15.0.0",
    # Configuration & monitoring
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
    # Browser automation
    "playwright>=1.60.0",
]

[project.urls]
Homepage = "https://github.com/Enablement-Engineering/gobbler"
Documentation = "https://enablement-engineering.github.io/gobbler/"
Repository = "https://github.com/Enablement-Engineering/gobbler"
Issues = "https://github.com/Enablement-Engineering/gobbler/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12.0",
    "pytest-benchmark>=4.0.0",
    "pytest-httpx>=0.30.0",

    "mypy>=2.1.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
    "interrogate>=1.7.0",
    "types-PyYAML>=6.0.0",
    "types-aiofiles>=24.0.0",

    "types-beautifulsoup4>=4.12.0.20250516",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
# Main CLI
gobbler = "gobbler_cli.main:cli"
# Queue worker
gobbler-worker = "gobbler_queue.worker:main"

[tool.uv]
# CI resolves without a checked-in lockfile. Require the Linux runner environment
# during resolution so uv avoids wheels that are only published for macOS/Windows.
required-environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/gobbler_core",
    "src/gobbler_cli",
    "src/gobbler_relay",
    "src/gobbler_queue",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "benchmark: marks tests as benchmark tests",
    "e2e: marks tests as end-to-end tests",
]
addopts = [
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    # SQLite connections in thread-local storage may not be garbage collected before test ends
    "ignore::ResourceWarning",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable comprehensive linting rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "C",   # mccabe complexity
    "C90", # mccabe complexity checks
    "D",   # pydocstyle (docstring checks)
    "S",   # flake8-bandit (security checks)
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "DTZ", # flake8-datetimez
    "EM",  # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "TRY", # tryceratops
    "NPY", # NumPy-specific rules
    "RUF", # Ruff-specific rules
]

ignore = [
    "D100",  # Missing docstring in public module (handled by interrogate)
    "D104",  # Missing docstring in public package
    "D107",  # Missing docstring in __init__
    "D203",  # 1 blank line required before class docstring (conflicts with D211)
    "D213",  # Multi-line docstring summary should start at the second line (conflicts with D212)
    "COM812", # Missing trailing comma (handled by formatter)
    "ISC001", # Implicitly concatenated string literals (handled by formatter)
    "S101",  # Use of assert detected (needed for pytest)
    "S603",  # subprocess call without shell=True - we use list args (secure pattern)
    "S607",  # Partial executable path - standard for system utilities like ffmpeg
    "PLC0415", # Import not at top-level - needed for circular dep avoidance and optional deps
    "PLR0913", # Too many arguments to function call
    "TRY003", # Avoid specifying long messages outside the exception class
    "TRY301", # Abstract raise to inner function - overly pedantic
]

# Complexity settings
mccabe.max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/**/*.py" = ["S101", "S603", "S607", "D", "PLR2004", "ARG001", "ARG002"]
"src/gobbler_cli/commands/convert.py" = ["PLR0912"]
"**/migrations/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "gobbler_core",
    "gobbler_cli",
    "gobbler_relay",
    "gobbler_queue",
]
combine-as-imports = true

[tool.coverage.run]
source = [
    "src/gobbler_core",
    "src/gobbler_cli",
    "src/gobbler_relay",
    "src/gobbler_queue",
]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/fixtures/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/site-packages/*",
    "*/__init__.py",
]

[tool.coverage.report]
# Minimum coverage threshold
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
skip_covered = false
skip_empty = true
show_missing = true
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.paths]
source = [
    "src/",
    "*/gobbler/src/",
]

[tool.bandit]
# Bandit security linter configuration
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist",
]
skips = [
    "B101",  # assert_used (needed for pytest)
    "B404",  # import_subprocess - we use subprocess safely with list args, not shell
    "B603",  # subprocess_without_shell_equals_true - we use list args, not shell=True
    "B607",  # start_process_with_partial_path - ffmpeg path varies by system
]
# Note: B107 (hardcoded passwords) is NOT skipped globally to catch real issues.
# Use inline # nosec B107 comments for intentional local dev tokens.

[tool.interrogate]
# Docstring coverage configuration
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
ignore-nested-functions = true
fail-under = 50
exclude = ["tests", "docs", "build", "dist"]
verbose = 1
color = true
