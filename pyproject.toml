[project]
name = "gobbler"
version = "0.2.0"
description = "Universal content conversion fabric - convert YouTube, web, documents, audio/video to markdown via CLI, API, SDK, or MCP"
authors = [
    {name = "Dylan Isaac", email = "dylan@enablement.engineering"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = [
    "mcp",
    "model-context-protocol",
    "markdown",
    "conversion",
    "transcription",
    "web-scraping",
    "youtube",
    "whisper",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    # Core conversion
    "youtube-transcript-api>=0.6.3",
    "yt-dlp>=2025.9.26",
    "faster-whisper>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    # HTTP & Async
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "aiofiles>=24.0.0",
    # API server (FastAPI)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # MCP server
    "fastmcp>=0.2.0",
    # CLI
    "typer>=0.15.0",
    "rich>=13.9.0",
    # Configuration & monitoring
    "pyyaml>=6.0.1",
    "watchdog>=4.0.0",
    "prometheus-client>=0.20.0",
    "psutil>=5.9.0",
    # Task queue
    "redis>=6.4.0",
    "rq>=2.6.0",
    # Browser automation
    "playwright>=1.49.0",
]

[project.urls]
Homepage = "https://github.com/Enablement-Engineering/gobbler"
Documentation = "https://github.com/Enablement-Engineering/gobbler#readme"
Repository = "https://github.com/Enablement-Engineering/gobbler"
Issues = "https://github.com/Enablement-Engineering/gobbler/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pytest-benchmark>=4.0.0",
    "pytest-httpx>=0.30.0",
    "fakeredis>=2.21.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
    "interrogate>=1.7.0",
    "types-PyYAML>=6.0.0",
    "types-aiofiles>=24.0.0",
    "types-redis>=4.6.0",
    "types-beautifulsoup4>=4.12.0",
]

[project.scripts]
# Main CLI
gobbler = "gobbler_cli.main:cli"
# Individual services
gobbler-daemon = "gobbler_daemon:main"
gobbler-api = "gobbler_api:main"
gobbler-mcp = "gobbler_mcp.__main__:main"
# Queue worker
gobbler-worker = "gobbler_queue.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/gobbler_core",
    "src/gobbler_daemon",
    "src/gobbler_api",
    "src/gobbler_sdk",
    "src/gobbler_cli",
    "src/gobbler_mcp",
    "src/gobbler_relay",
    "src/gobbler_queue",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "benchmark: marks tests as benchmark tests",
    "e2e: marks tests as end-to-end tests",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src/gobbler_mcp",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable comprehensive linting rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "C",   # mccabe complexity
    "C90", # mccabe complexity checks
    "D",   # pydocstyle (docstring checks)
    "S",   # flake8-bandit (security checks)
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "DTZ", # flake8-datetimez
    "EM",  # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "TRY", # tryceratops
    "NPY", # NumPy-specific rules
    "RUF", # Ruff-specific rules
]

ignore = [
    "D100",  # Missing docstring in public module (handled by interrogate)
    "D104",  # Missing docstring in public package
    "D107",  # Missing docstring in __init__
    "D203",  # 1 blank line required before class docstring (conflicts with D211)
    "D213",  # Multi-line docstring summary should start at the second line (conflicts with D212)
    "COM812", # Missing trailing comma (handled by formatter)
    "ISC001", # Implicitly concatenated string literals (handled by formatter)
    "S101",  # Use of assert detected (needed for pytest)
    "PLR0913", # Too many arguments to function call
    "TRY003", # Avoid specifying long messages outside the exception class
]

# Complexity settings
mccabe.max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/**/*.py" = ["S101", "D", "PLR2004", "ARG001"]
"**/migrations/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "gobbler_core",
    "gobbler_daemon",
    "gobbler_api",
    "gobbler_sdk",
    "gobbler_cli",
    "gobbler_mcp",
    "gobbler_relay",
    "gobbler_queue",
]
combine-as-imports = true

[tool.coverage.run]
source = [
    "src/gobbler_core",
    "src/gobbler_daemon",
    "src/gobbler_api",
    "src/gobbler_sdk",
    "src/gobbler_cli",
    "src/gobbler_mcp",
    "src/gobbler_relay",
    "src/gobbler_queue",
]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/fixtures/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/site-packages/*",
    "*/__init__.py",
]

[tool.coverage.report]
# Minimum coverage threshold
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
skip_covered = false
skip_empty = true
show_missing = true
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.paths]
source = [
    "src/",
    "*/gobbler/src/",
]

[tool.bandit]
# Bandit security linter configuration
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist",
]
skips = [
    "B101",  # assert_used (needed for pytest)
]
severity = "medium"

[tool.interrogate]
# Docstring coverage configuration
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
ignore-nested-functions = true
fail-under = 50
exclude = ["tests", "docs", "build", "dist"]
verbose = 1
color = true
